    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

     NAVBAR
========================= -->

    <div class="container">

        <a class="navbar-brand fw-bold text-success fs-3"
           href="index.html">
            SAMANA
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="experience.html">
                        Experiences
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="bookings.html">

                    </button>

<!-- =========================
     PROFILE SECTION
========================= -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <div
                            class="rounded-circle bg-success text-white d-inline-flex align-items-center justify-content-center"
                            style="width:80px;height:80px;">

                            <i class="fa-solid fa-user fa-2x"></i>

                        </div>

                        <h2 class="mt-3">
                            My Profile
                        </h2>

                        <p class="text-muted">
                            View and update your account details
                        </p>

                    </div>


                    <!-- MESSAGE -->

                    <div id="profileMessage"></div>


                    <!-- PROFILE FORM -->

                    <form id="profileForm">

                        <!-- USER ID -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                User ID
                            </label>

                            <input
                                type="text"
                                id="userId"
                                class="form-control"
                                readonly>

                        </div>


                        <!-- NAME -->

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label fw-bold">

                                Full Name

                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-bold">

                                Email

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                required>

                        </div>


                        <!-- UPDATE BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Update Profile

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer class="bg-dark text-white text-center py-4">

    © 2026 SAMANA. All rights reserved.

</footer>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="js/toast.js"></script>

<script src="js/script.js"></script>

<script>

    // =========================================
    // CHECK LOGIN
    // =========================================

    const token = localStorage.getItem("token");
    const storedUserId = localStorage.getItem("userId");

    if (!token || !storedUserId) {

        window.location.href = "login.html";

    }


    // =========================================
    // LOAD PROFILE
    // =========================================

    async function loadProfile() {

        const message =
            document.getElementById("profileMessage");

        try {

            const user =
                await apiRequest("/users/" + storedUserId);

            console.log("Profile received:", user);

            document.getElementById("userId").value =
                user.id;

            document.getElementById("name").value =
                user.name || "";

            document.getElementById("email").value =
                user.email || "";

        } catch (error) {

            console.error(
                "Failed to load profile:",
                error
            );

            message.innerHTML = `
                <div class="alert alert-danger">
                    Unable to load your profile.
                </div>
            `;

        }

    }


    // =========================================
    // UPDATE PROFILE
    // =========================================

    document
        .getElementById("profileForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const message =
                document.getElementById("profileMessage");

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();


            if (!name || !email) {

                message.innerHTML = `
                    <div class="alert alert-warning">
                        Please enter both name and email.
                    </div>
                `;

                return;

            }


            try {

                const updatedUser =
                    await apiRequest(
                        "/users/" + storedUserId,
                        {
                            method: "PUT",

                            body: JSON.stringify({
                                name: name,
                                email: email
                            })
                        }
                    );


                console.log(
                    "Updated profile:",
                    updatedUser
                );


                // Update localStorage

                localStorage.setItem(
                    "userName",
                    updatedUser.name
                );

                localStorage.setItem(
                    "userEmail",
                    updatedUser.email
                );


                message.innerHTML = `
                    <div class="alert alert-success">
                        <i class="fa-solid fa-circle-check"></i>
                        Profile updated successfully!
                    </div>
                `;


            } catch (error) {

                console.error(
                    "Profile update error:",
                    error
                );

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Unable to update profile.
                    </div>
                `;

            }

        });


    // =========================================
    // LOGOUT
    // =========================================

    function logoutUser() {

        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        localStorage.removeItem("userRole");

        window.location.href = "login.html";

    }


    // =========================================
    // START
    // =========================================

    loadProfile();

</script>

</body>

</html>
